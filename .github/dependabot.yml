# weekly bumps. prefixes keep the pr titles and commits conventional (commits.yml)
version: 2
registries:
  # @wasichai/* are private packages of wasichai-ui: a read:packages PAT in the dependabot secret PACKAGES_TOKEN
  wasichai:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.PACKAGES_TOKEN }}
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: npm
    directory: /
    registries:
      - wasichai
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
