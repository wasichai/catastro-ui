name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # one version for the app. merging its pr bumps package.json, writes CHANGELOG.md, tags and creates the github release.
      # no release yet: the manifest is empty and initial-version makes the first one 1.0.0
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # a pr opened with GITHUB_TOKEN does not trigger ci.yml or commits.yml; a PAT lets its checks run
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
